[versions]
# Not managed by the Boot BOM. 3.9.0 is the first line with Spring Boot 4 support.
kotlin-jdsl = "3.9.0"

[libraries]
# Version managed by spring-boot-dependencies via the shared platform. Deliberately NOT in the
# shared catalog: services must reach the broker through the buses, never the client directly.
amqp-client = { module = "com.rabbitmq:amqp-client" }
slf4j-api = { module = "org.slf4j:slf4j-api" }
slf4j-simple = { module = "org.slf4j:slf4j-simple" }
spring-aop = { module = "org.springframework:spring-aop" }
spring-beans = { module = "org.springframework:spring-beans" }
spring-context = { module = "org.springframework:spring-context" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-tx = { module = "org.springframework:spring-tx" }
assertj-core = { module = "org.assertj:assertj-core" }
postgresql = { module = "org.postgresql:postgresql" }
jakarta-annotation-api = { module = "jakarta.annotation:jakarta.annotation-api" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
micrometer-tracing = { module = "io.micrometer:micrometer-tracing" }
spring-web = { module = "org.springframework:spring-web" }
spring-webmvc = { module = "org.springframework:spring-webmvc" }
spring-data-commons = { module = "org.springframework.data:spring-data-commons" }
spring-test = { module = "org.springframework:spring-test" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api" }
json-path = { module = "com.jayway.jsonpath:json-path" }
spring-data-jpa = { module = "org.springframework.data:spring-data-jpa" }
spring-orm = { module = "org.springframework:spring-orm" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core" }
kotlin-jdsl-dsl = { module = "com.linecorp.kotlin-jdsl:jpql-dsl", version.ref = "kotlin-jdsl" }
kotlin-jdsl-query-model = { module = "com.linecorp.kotlin-jdsl:jpql-query-model", version.ref = "kotlin-jdsl" }
kotlin-jdsl-render = { module = "com.linecorp.kotlin-jdsl:jpql-render", version.ref = "kotlin-jdsl" }
kotlin-jdsl-spring-data-jpa = { module = "com.linecorp.kotlin-jdsl:spring-data-jpa-boot4-support", version.ref = "kotlin-jdsl" }
